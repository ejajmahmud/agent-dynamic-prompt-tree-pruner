[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dynamic-prompt-tree-pruner"
version = "0.1.0"
description = "AST-driven execution branch pruner and token economizer for complex multi-branch agent chains"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-dynamic-prompt-tree-pruner = "agent_dynamic_prompt_tree_pruner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_dynamic_prompt_tree_pruner*"]
